name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Every action below is pinned to a major that runs on Node 24 natively.
# Node 20 actions still work but the runner warns; these need Actions
# Runner v2.327.1+, which GitHub-hosted runners have.
env:
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>, lowercased by the metadata action
  IMAGE_NAME: ${{ github.repository }}
  # Add linux/arm64 here if the host running Suggestarr is arm (a Pi, an
  # Apple Silicon box). It roughly triples build time: better-sqlite3 is a
  # native module and the arm build runs under QEMU emulation.
  PLATFORMS: linux/amd64

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Every integration is mocked (msw + in-memory Discord + the offline
      # judge), so the whole pipeline runs here with no keys and no network.
      - name: Test with coverage
        run: npm run test:coverage
        env:
          LLM_PROVIDER: mock

  image:
    # Nothing reaches the registry unless the suite is green.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Only needed once PLATFORMS includes a non-native arch; cheap to
      # always set up so flipping arm64 on is genuinely a one-line change.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Built once, loaded locally, and smoke-tested before anything is
      # pushed — a Dockerfile that builds but cannot start never ships.
      - name: Build for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: suggestarr:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and the CLI answers
        run: |
          docker run --rm --entrypoint node suggestarr:verify dist/main.js nonsense 2>&1 \
            | grep -q 'Usage: suggestarr'

      # Pull requests stop here: they get the build and the smoke test, but
      # no credentials and no push. A fork's token cannot write packages.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Same layers as the verification build, so this is a re-tag in
          # practice rather than a second compile.
          cache-from: type=gha
          cache-to: type=gha,mode=max
